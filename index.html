<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta
      name="description"
      content="Aggiungi «Pagina web in PDF» alla barra degli strumenti di Chrome e salva qualsiasi pagina web in formato PDF."
    >
    <title>«Pagina web in PDF» è stata installata! Ecco come iniziare.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/pdf-icon-32.png">
    <link rel="stylesheet" href="styles.css?v=mascot-gap-2">
  </head>
  <body>
    <main class="page">
      <header class="intro" aria-labelledby="welcome-title">
        <h1 id="welcome-title">
          <span class="headline-main">
            <span class="headline-product">
              <img class="headline-mascot" src="assets/mascot-heading-hires.png" width="1088" height="760" alt="" aria-hidden="true">
              <span>«Pagina web in PDF»</span>
            </span>
            <span class="headline-keep">è stata installata!&nbsp;🎉</span>
          </span>
          <span class="headline-sub">Ecco come iniziare.</span>
        </h1>
      </header>

      <section class="instruction" aria-labelledby="pin-step">
        <h2 class="step" id="pin-step">
          Apri il menu Estensioni (1) nell’angolo in alto a destra di Chrome. Quindi fai clic sull’icona a forma di puntina (2) accanto a «Pagina web in PDF».
        </h2>
        <figure class="browser-shot browser-shot--localized">
          <img src="assets/pin-extension.png" alt="Menu Estensioni di Chrome aperto con l’icona per aggiungere «Pagina web in PDF» alla barra degli strumenti">
          <svg class="localized-label" viewBox="0 0 2600 1193" aria-hidden="true" focusable="false">
            <rect x="1848" y="463" width="335" height="42" fill="#fafbfc" />
            <text x="1854" y="496" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="26">Pagina web in PDF</text>
          </svg>
        </figure>
      </section>

      <section class="instruction instruction--last" aria-labelledby="open-step">
        <h2 class="step" id="open-step">
          Tutto pronto! Fai clic sull’icona PDF (3) ogni volta che vuoi salvare una pagina web.
        </h2>
        <figure class="browser-shot">
          <img src="assets/open-extension.png" alt="Icona di «Pagina web in PDF» nella barra degli strumenti di Chrome">
        </figure>
      </section>
    </main>
  </body>
</html>
